global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'voice-assistant-monitor'

scrape_configs:
  # =========================
  # PROMETHEUS SELF
  # =========================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # =========================
  # BACKEND METRICS
  # =========================
  - job_name: 'backend'
    static_configs:
      - targets: ['backend:3000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # =========================
  # AI SERVICES METRICS
  # =========================
  - job_name: 'ai-services'
    static_configs:
      - targets: ['ai-services:5000']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # =========================
  # POSTGRES EXPORTER
  # =========================
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

  # =========================
  # REDIS EXPORTER
  # =========================
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s

  # =========================
  # NODE EXPORTER (SYSTEM METRICS)
  # =========================
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s
