worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include       mime.types;
  default_type  application/octet-stream;

  sendfile on;
  keepalive_timeout 65;

  client_max_body_size 20M;

  # HTTP → HTTPS
  server {
    listen 80;
    server_name voice-assistant.io.vn;
    return 301 https://$host$request_uri;
  }

  # HTTPS
  server {
    listen 443 ssl;
    server_name voice-assistant.io.vn;

    ssl_certificate /etc/letsencrypt/live/voice-assistant.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/voice-assistant.io.vn/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    # =========================
    # FRONTEND
    # =========================
    location / {
      proxy_pass http://voice-assistant-frontend:80;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================
    # BACKEND API
    # =========================
    location /api/ {
      proxy_pass http://voice-assistant-backend:3000;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # HEALTH
    location /health {
      proxy_pass http://voice-assistant-backend:3000/health;
    }

    # =========================
    # AI SERVICE
    # =========================
    location /ai/ {
      proxy_pass http://voice-assistant-ai-services:5000;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # SOCKET.IO
    location /socket.io/ {
      proxy_pass http://voice-assistant-backend:3000;

      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";

      proxy_buffering off;
    }

    # =========================
    # GRAFANA
    # =========================
    location /monitor/ {
      proxy_pass http://voice-assistant-grafana:3000;

      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}